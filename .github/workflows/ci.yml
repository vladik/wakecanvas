name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  projects:
    name: ${{ matrix.os }} / ${{ matrix.project }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        project: [experiences/sdk, experiences/living_gallery, platform]
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29.1.1"
          elixir-version: "1.20.4"
      - run: mix deps.get
        working-directory: ${{ matrix.project }}
      - run: mix format --check-formatted
        working-directory: ${{ matrix.project }}
      - run: mix compile --warnings-as-errors
        working-directory: ${{ matrix.project }}
      - run: mix test
        working-directory: ${{ matrix.project }}
